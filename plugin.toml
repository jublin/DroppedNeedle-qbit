[plugin]
name = "qbittorrent"
display_name = "Prowlarr + qBittorrent"
version = "1.1.3"
api_version = 2
entrypoint = "plugin:QBittorrent"
capabilities = ["download_client", "indexer"]
description = "Searches torrent indexers through Prowlarr and downloads with qBittorrent, in the music category."
author = "Justin Moore"

[[capability]]
id = "download_client"
display_name = "qBittorrent"

[[capability]]
id = "indexer"
target_source = "plugin:qbittorrent"

[[settings]]
key = "prowlarr_url"
label = "Prowlarr URL"
help = "e.g. http://prowlarr:9696. Leave empty to use only another indexer plugin. qBittorrent must be able to reach this address too when a result is a .torrent URL."

[[settings]]
key = "prowlarr_api_key"
label = "Prowlarr API key"
help = "Prowlarr > Settings > General > API Key."
secret = true

[[settings]]
key = "prowlarr_categories"
label = "Prowlarr categories"
help = "Comma-separated Newznab category ids to search. Defaults to 3000 (Audio)."

[[settings]]
key = "min_seeders"
label = "Minimum seeders"
help = "Results with fewer seeders are dropped. Defaults to 1."

[[settings]]
key = "url"
label = "qBittorrent URL"
help = "Web UI address, e.g. http://qbittorrent:8080"

[[settings]]
key = "api_key"
label = "API key"
help = "qBittorrent API key (Options > WebUI), if your version supports it. When set, the username and password are not used."
secret = true

[[settings]]
key = "username"
label = "Username"
help = "Web UI username. Leave empty if using an API key or if localhost/subnet authentication is bypassed."

[[settings]]
key = "password"
label = "Password"
help = "Web UI password."
secret = true

[[settings]]
key = "category"
label = "Category"
help = "Category set on every torrent DroppedNeedle adds. Created if missing. Defaults to music."

[[settings]]
key = "downloads_dir"
label = "Downloads directory"
help = "Where DroppedNeedle sees qBittorrent's completed downloads (the category's save path). Finished files must be inside this folder."

[[settings]]
key = "remote_path"
label = "qBittorrent path (optional)"
help = "The same folder as qBittorrent sees it, if the paths differ (e.g. /downloads when DroppedNeedle mounts it at /data/music-dl). Leave empty if both see the same path."

[[settings]]
key = "discard_action"
label = "When a download is discarded"
help = "keep, remove (torrent only, default) or remove_with_files. Applies after import or failure; aborted downloads always delete their partial files."
